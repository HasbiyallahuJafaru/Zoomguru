<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Payment Successful — ZoomGuru</title>
  <link rel="icon" href="logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card { width: 100%; max-width: 360px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .brand { font-size: 22px; font-weight: 400; font-style: italic; color: rgba(255,255,255,0.85);
      font-family: 'Palatino Linotype', Palatino, Georgia, serif; }
    .check {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.5);
      color: #10b981; font-size: 28px; line-height: 54px;
    }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
    p { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">ZoomGuru</div>
    <div class="check">&#10003;</div>
    <h1>Payment successful</h1>
    <p>Your subscription is now active. You can return to the ZoomGuru app — this window will close automatically.</p>
  </div>

  <script>
    (function () {
      'use strict';
      // Fallback confirmation: if the checkout page's confirm call was interrupted
      // by the redirect, retry it here. The backend treats this idempotently and
      // the Paystack webhook is the ultimate backstop.
      var API = 'https://zoomguru-backend-production.up.railway.app';
      var params = new URLSearchParams(window.location.search);
      var session = params.get('session');
      var reference = params.get('reference');
      if (session && reference) {
        fetch(API + '/payments/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: session, reference: reference })
        }).catch(function () { /* webhook will reconcile */ });
      }
    })();
  </script>
</body>
</html>
