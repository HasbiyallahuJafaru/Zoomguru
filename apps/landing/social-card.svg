<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .bg { fill: #111111; }
      .brand { font-family: 'Playfair Display', 'Georgia', serif; font-weight: 900; font-size: 96px; fill: #f5f3ee; letter-spacing: -2px; }
      .brand-em { font-family: 'Playfair Display', 'Georgia', serif; font-weight: 400; font-style: italic; font-size: 96px; fill: #f5f3ee; letter-spacing: -2px; }
      .tagline { font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif; font-weight: 400; font-size: 28px; fill: #888074; }
      .domain { font-family: 'DM Mono', 'Consolas', monospace; font-weight: 300; font-size: 18px; fill: rgba(245,243,238,0.35); letter-spacing: 0.08em; }
      .accent { stroke: #f5f3ee; stroke-width: 1; fill: none; opacity: 0.08; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" class="bg" />

  <!-- Subtle decorative doodle elements matching site aesthetic -->
  <g opacity="0.06">
    <circle cx="100" cy="530" r="40" fill="none" stroke="#f5f3ee" stroke-width="1.2"/>
    <circle cx="1100" cy="100" r="22" fill="none" stroke="#f5f3ee" stroke-width="1"/>
    <circle cx="1050" cy="520" r="16" fill="none" stroke="#f5f3ee" stroke-width="0.9"/>
    <circle cx="950" cy="550" r="10" fill="none" stroke="#f5f3ee" stroke-width="0.8"/>
    <path d="M50 300 Q100 280 150 300 Q200 320 250 300" fill="none" stroke="#f5f3ee" stroke-width="0.8"/>
    <path d="M950 200 Q1000 180 1050 200 Q1100 220 1150 200" fill="none" stroke="#f5f3ee" stroke-width="0.8"/>
    <line x1="100" y1="150" x2="120" y2="150" stroke="#f5f3ee" stroke-width="1.2"/>
    <line x1="110" y1="140" x2="110" y2="160" stroke="#f5f3ee" stroke-width="1.2"/>
  </g>

  <!-- Center content area -->
  <g transform="translate(600, 290)">
    <!-- Small accent line above brand -->
    <line x1="-40" y1="-80" x2="40" y2="-80" stroke="#f5f3ee" stroke-width="1.5" opacity="0.5"/>

    <!-- Brand name: Zoom(italic)Guru -->
    <text text-anchor="middle" y="-30">
      <tspan class="brand">Zoom</tspan><tspan class="brand-em">Guru</tspan>
    </text>

    <!-- Tagline -->
    <text text-anchor="middle" y="30" class="tagline">AI Interview Copilot for Live Interviews</text>

    <!-- Divider -->
    <line x1="-60" y1="60" x2="60" y2="60" stroke="#f5f3ee" stroke-width="0.5" opacity="0.2"/>

    <!-- Domain -->
    <text text-anchor="middle" y="100" class="domain">zoomguru.xyz</text>
  </g>
</svg>
