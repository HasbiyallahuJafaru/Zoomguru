<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ZoomGuru — Secure Checkout</title>
  <link rel="icon" href="logo.png" />
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 360px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .brand { font-size: 22px; font-weight: 400; font-style: italic; color: rgba(255,255,255,0.85);
      font-family: 'Palatino Linotype', Palatino, Georgia, serif; }
    .amount { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; }
    .plan { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
    .status { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.5; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15); border-top-color: rgba(255,255,255,0.7);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      margin-top: 4px; padding: 11px 26px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.85);
      font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 120ms ease;
    }
    .btn:hover { opacity: 0.85; }
    .lock { font-size: 11px; color: rgba(255,255,255,0.28); letter-spacing: 0.04em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">ZoomGuru</div>
    <div id="amount" class="amount" hidden></div>
    <div id="plan" class="plan" hidden></div>
    <div id="spinner" class="spinner"></div>
    <div id="status" class="status">Preparing secure checkout&hellip;</div>
    <button id="retry" class="btn" hidden>Try again</button>
    <div class="lock">🔒 Payments processed securely by Paystack</div>
  </div>

  <script>
    (function () {
      'use strict';
      var API = 'https://zoomguru-backend-production.up.railway.app';
      var PLAN_LABELS = { weekly: 'Weekly plan', monthly: 'Monthly plan', yearly: 'Yearly plan' };

      var params   = new URLSearchParams(window.location.search);
      var session  = params.get('session');
      var statusEl = document.getElementById('status');
      var spinner  = document.getElementById('spinner');
      var retry    = document.getElementById('retry');
      var amountEl = document.getElementById('amount');
      var planEl   = document.getElementById('plan');

      function fail(msg) {
        statusEl.textContent = msg;
        spinner.hidden = true;
        retry.hidden = false;
      }

      retry.addEventListener('click', function () { window.location.reload(); });

      if (!session || !/^[0-9a-f]{64}$/i.test(session)) {
        fail('This checkout link is invalid. Please return to the app and try again.');
        return;
      }

      fetch(API + '/payments/session?session=' + encodeURIComponent(session))
        .then(function (r) {
          if (!r.ok) throw new Error('expired');
          return r.json();
        })
        .then(function (d) {
          amountEl.textContent = '₦' + (d.amount / 100).toLocaleString();
          amountEl.hidden = false;
          planEl.textContent = PLAN_LABELS[d.plan] || d.plan;
          planEl.hidden = false;
          statusEl.textContent = 'Opening payment…';

          var handler = PaystackPop.setup({
            key: d.publicKey,
            email: d.email,
            amount: d.amount,
            currency: 'NGN',
            // Restrict methods so bank transfer is the default (and hide the QR
            // "barcode" option); matches the pre-migration in-app behaviour.
            channels: ['bank_transfer', 'ussd', 'opay'],
            onClose: function () {
              fail('Payment cancelled. You can try again or close this window.');
            },
            callback: function (response) {
              statusEl.textContent = 'Confirming your payment…';
              spinner.hidden = false;
              retry.hidden = true;
              var ref = response.reference;
              var success = 'payment-success.html?session=' + encodeURIComponent(session) +
                '&reference=' + encodeURIComponent(ref);
              fetch(API + '/payments/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session: session, reference: ref })
              })
                .then(function () { window.location.href = success; })
                .catch(function () { window.location.href = success; });
            }
          });
          handler.openIframe();
        })
        .catch(function () {
          fail('This checkout link has expired. Please return to the app and start again.');
        });
    })();
  </script>
</body>
</html>
